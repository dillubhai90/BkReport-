    margin: 0;

/* GRID BACKGROUND */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background-image: linear-gradient(#111 1px, transparent 1px),
                      linear-gradient(90deg, #111 1px, transparent 1px);
    background-size: 35px 35px;

.green {background: darkgreen;}
.red {background: darkred;}

/* STATS */

    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
}

.box {
    background: #0a0a0a;
    padding: 12px;

}

/* BIG TELEGRAM BUTTON */

    margin: 25px 15px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

    width: 100%;
    padding: 18px 0;

    font-size: 18px;
    font-weight: bold;

    text-decoration: none;
    color: white;

    border-radius: 12px;
    background: linear-gradient(90deg, #1db954, #ff0033);

    box-shadow: 0 0 20px rgba(255,0,0,0.5);
    animation: zoom 1s infinite alternate;
}

/* ICON */
.btn img {
    width: 24px;
}

/* ZOOM ANIMATION */
@keyframes zoom {
    from {transform: scale(1);}
    to {transform: scale(1.06);}
}

/* FEATURES */
.features {
    margin: 20px 15px;
    padding: 15px;
    border-radius: 10px;
    background: #0a0a0a;
    box-shadow: 0 0 15px yellow;
    font-size: 13px;

/* FOOTER */
footer {
