body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: black;
    color: white;
    text-align: center;
}

/* GRID BACKGROUND */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background-image: linear-gradient(#111 1px, transparent 1px),
                      linear-gradient(90deg, #111 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: -1;
}

/* LOGO */
.logo {
    margin-top: 40px;
}

.logo img {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 5px solid lime;

}

/* HEADING */

    color: #ffd700;
    font-size: 34px;
    margin-top: 20px;
}

/* MEMBERS TEXT */
.members {
    font-size: 20px;
    margin-top: 10px;
}

/* BUTTONS SMALL */
.badges {
    margin-top: 10px;
}

.badges span {
    display: inline-block;
    margin: 5px;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 14px;
}

.green {background: darkgreen;}
.red {background: darkred;}

/* STATS BOX */
.stats {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 25px;
}

.box {
    background: #0a0a0a;
    padding: 20px;
    border-radius: 12px;
    width: 110px;
    box-shadow: 0 0 15px yellow;
}

.box h2 {
    margin: 0;
    color: yellow;
}

/* TELEGRAM BUTTON */
.btn {
    margin-top: 30px;
}

.btn a {
    display: inline-block;
    padding: 18px 40px;
    font-size: 20px;
    text-decoration: none;
    color: white;
    border-radius: 12px;
    background: linear-gradient(90deg, green, red);
    animation: zoom 1s infinite alternate;
}

/* ZOOM ANIMATION */
@keyframes zoom {
    from {transform: scale(1);}
    to {transform: scale(1.08);}
}

/* BOTTOM BOX */
.features {
    margin: 30px;
    padding: 20px;
    border-radius: 12px;
    background: #0a0a0a;
    box-shadow: 0 0 20px yellow;
}

/* FOOTER */
footer {
    margin-top: 20px;
    font-size: 14px;
    color: #bbb;
}
</style>
</head>
